[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vitouch"
version = "0.4.0"
description = "Waydroid gaming transparent ghost overlay and keymapper for TFT Mobile on Linux"
readme = "README.md"
authors = [{ name = "Arjun Sharma & Antigravity" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "evdev>=1.6.0",
    "PyQt6>=6.4.0",
]

[project.scripts]
vitouch = "vitouch.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
