name: Build & Release ViTouch

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Standalone Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxkbcommon-x11-0 libxcb-cursor0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed \
            --name "ViTouch" \
            --paths "src" \
            --hidden-import "evdev" \
            --hidden-import "PyQt6" \
            --hidden-import "PyQt6.QtCore" \
            --hidden-import "PyQt6.QtGui" \
            --hidden-import "PyQt6.QtWidgets" \
            src/vitouch/app.py
          mkdir -p dist/ViTouch/profiles
          cp -r profiles/* dist/ViTouch/profiles/ 2>/dev/null || true
          cp README.md dist/ViTouch/ 2>/dev/null || true
          cp setup.sh dist/ViTouch/ 2>/dev/null || true
          cd dist
          tar -czvf ViTouch-Linux-x86_64.tar.gz ViTouch
          cd ..

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViTouch-Linux-x86_64
          path: dist/ViTouch-Linux-x86_64.tar.gz

  release:
    name: Publish GitHub Release
    needs: [build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ViTouch-Linux-x86_64
          path: release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/ViTouch-Linux-x86_64.tar.gz
          draft: false
          prerelease: false
          generate_release_notes: true
